[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tanque-esferico"
version = "1.0.0"
description = "Profundidad de un tanque esférico (V = 30 m³) con Bisección, Interpolación Lineal y Newton-Raphson"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Luis Eulacio" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
]

[project.scripts]
tanque-esferico = "main:main"

[tool.setuptools]
py-modules = [
    "main",
    "problema",
    "utils",
    "biseccion",
    "interpolacion_lineal",
    "newton_raphson",
    "verificacion",
]
